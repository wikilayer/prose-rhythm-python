name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          make install-tools
          make install
      - name: Build
        run: make build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "releases must be dispatched from main" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(python -c 'import prose_rhythm; print(prose_rhythm.__version__)')"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "version must match the package version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          CHANGELOG_VERSION="$(sed -n 's/^## \([0-9][0-9.]*\).*$/\1/p' CHANGELOG.md | head -1)"
          if [[ "$VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "version must match the latest CHANGELOG entry: $CHANGELOG_VERSION" >&2
            exit 1
          fi
          NOTES="$(sed -n "/^## ${VERSION} /,/^## /p" CHANGELOG.md | sed '1d;$d')"
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --notes "$NOTES"
